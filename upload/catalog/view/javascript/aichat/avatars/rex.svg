<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="ac-rex is-idle" focusable="false" aria-hidden="true"><style>
svg.ac-rex *{transform-box:fill-box}
svg.ac-rex .bob{transform-origin:50% 100%;animation:ac-breath 4.2s ease-in-out infinite}
svg.ac-rex .head{transform-origin:50% 100%}
svg.ac-rex .eye{transform-origin:50% 50%;animation:ac-blink 4.6s infinite}
svg.ac-rex .eyes{transform-origin:50% 50%}
svg.ac-rex .m-smile,svg.ac-rex .m-open{transform-origin:50% 50%}
svg.ac-rex .m-open{opacity:0;transform:scaleY(.2)}
svg.ac-rex .think,svg.ac-rex .spark{opacity:0}
svg.ac-rex .cheek{opacity:.55}
svg.ac-rex .ring{transform-origin:50% 50%;animation:ac-spin 9s linear infinite}
svg.ac-rex.is-listening .head{animation:ac-tilt 2.4s ease-in-out infinite}
svg.ac-rex.is-listening .eyes{transform:scale(1.08)}
svg.ac-rex.is-listening .ear{animation:ac-ear 1.2s ease-in-out infinite;transform-origin:50% 100%}
svg.ac-rex.is-thinking .eyes{animation:ac-look 2.4s ease-in-out infinite}
svg.ac-rex.is-thinking .m-smile{transform:scaleX(.55)}
svg.ac-rex.is-thinking .think{opacity:1}
svg.ac-rex.is-thinking .think circle{animation:ac-dot 1.2s ease-in-out infinite}
svg.ac-rex.is-thinking .think circle:nth-child(2){animation-delay:.2s}
svg.ac-rex.is-thinking .think circle:nth-child(3){animation-delay:.4s}
svg.ac-rex.is-talking .m-smile{opacity:0}
svg.ac-rex.is-talking .m-open{opacity:1;animation:ac-talk .36s ease-in-out infinite}
svg.ac-rex.is-talking .bob{animation:ac-breath 1.5s ease-in-out infinite}
svg.ac-rex.is-happy .bob{animation:ac-hop .55s ease-out 2}
svg.ac-rex.is-happy .eye{animation:none;transform:scaleY(.5)}
svg.ac-rex.is-happy .cheek{opacity:1}
svg.ac-rex.is-happy .m-smile{transform:scale(1.25)}
svg.ac-rex.is-happy .spark{opacity:1;animation:ac-spark .9s ease-in-out 2}
@keyframes ac-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
@keyframes ac-blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes ac-tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}}
@keyframes ac-ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes ac-look{0%,100%{transform:translate(-1.6px,-1.6px)}50%{transform:translate(1.6px,-1.6px)}}
@keyframes ac-dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes ac-talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.15)}}
@keyframes ac-hop{0%{transform:translateY(0)}40%{transform:translateY(-3px) scale(1.03)}100%{transform:translateY(0)}}
@keyframes ac-spark{0%,100%{transform:scale(.6) rotate(0)}50%{transform:scale(1.15) rotate(20deg)}}
@keyframes ac-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){svg.ac-rex *{animation:none!important;transition:none!important}}</style><circle cx="32" cy="32" r="32" fill="#d8f0ff"/><g class="bob"><path d="M9 54C10 45 20 42 32 42S54 45 55 54A32 32 0 0 1 9 54Z" fill="#ee7b30"/><path d="M25 43Q32 56 39 43Q32 47 25 43Z" fill="#fff6ea"/><g class="head"><path class="ear" d="M15 27L14 6 29 17.5Z" fill="#ee7b30"/><path class="ear" d="M49 27L50 6 35 17.5Z" fill="#ee7b30"/><path d="M18 21L17.6 11.5 25 17Z" fill="#3a2a30"/><path d="M46 21L46.4 11.5 39 17Z" fill="#3a2a30"/><path d="M14 24C14 16 20 15 24 18 28 16.5 36 16.5 40 18 44 15 50 16 50 24 51 36 42 47 32 47S13 36 14 24Z" fill="#ee7b30"/><path d="M32 47C24 47 17 40 15 34 22 36.5 27 37 32 33 37 37 42 36.5 49 34 47 40 40 47 32 47Z" fill="#fff6ea"/><g class="eyes"><g class="eye"><ellipse cx="24.5" cy="30.5" rx="2.3" ry="2.9" fill="#2b2438"/><circle cx="25.3" cy="29.5" r=".85" fill="#fff"/></g><g class="eye"><ellipse cx="39.5" cy="30.5" rx="2.3" ry="2.9" fill="#2b2438"/><circle cx="40.3" cy="29.5" r=".85" fill="#fff"/></g></g><path class="m-smile" d="M28.6 42.6Q32 46.4 35.4 42.6" fill="none" stroke="#2b2438" stroke-width="1.6" stroke-linecap="round"/><ellipse class="m-open" cx="32" cy="43.800000000000004" rx="2.9" ry="2.7" fill="#6b2c3e"/><circle cx="32" cy="38.8" r="2.3" fill="#2b2438"/></g></g><g class="think" fill="#ee7b30"><circle cx="44" cy="9" r="2"/><circle cx="50" cy="12.5" r="2"/><circle cx="55" cy="18" r="2"/></g><g class="spark"><path d="M11 11L12.2 13.8L15 15L12.2 16.2L11 19L9.8 16.2L7 15L9.8 13.8Z" fill="#ffc933"/><path d="M53 7.8L53.96 10.04L56.2 11L53.96 11.96L53 14.2L52.04 11.96L49.8 11L52.04 10.04Z" fill="#ffc933"/></g></svg>
