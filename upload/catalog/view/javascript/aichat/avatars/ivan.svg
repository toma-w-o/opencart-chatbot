<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="ac-ivan is-idle" focusable="false" aria-hidden="true"><style>
svg.ac-ivan *{transform-box:fill-box}
svg.ac-ivan .bob{transform-origin:50% 100%;animation:ac-breath 4.2s ease-in-out infinite}
svg.ac-ivan .head{transform-origin:50% 100%}
svg.ac-ivan .eye{transform-origin:50% 50%;animation:ac-blink 4.6s infinite}
svg.ac-ivan .eyes{transform-origin:50% 50%}
svg.ac-ivan .m-smile,svg.ac-ivan .m-open{transform-origin:50% 50%}
svg.ac-ivan .m-open{opacity:0;transform:scaleY(.2)}
svg.ac-ivan .think,svg.ac-ivan .spark{opacity:0}
svg.ac-ivan .cheek{opacity:.55}
svg.ac-ivan .ring{transform-origin:50% 50%;animation:ac-spin 9s linear infinite}
svg.ac-ivan.is-listening .head{animation:ac-tilt 2.4s ease-in-out infinite}
svg.ac-ivan.is-listening .eyes{transform:scale(1.08)}
svg.ac-ivan.is-listening .ear{animation:ac-ear 1.2s ease-in-out infinite;transform-origin:50% 100%}
svg.ac-ivan.is-thinking .eyes{animation:ac-look 2.4s ease-in-out infinite}
svg.ac-ivan.is-thinking .m-smile{transform:scaleX(.55)}
svg.ac-ivan.is-thinking .think{opacity:1}
svg.ac-ivan.is-thinking .think circle{animation:ac-dot 1.2s ease-in-out infinite}
svg.ac-ivan.is-thinking .think circle:nth-child(2){animation-delay:.2s}
svg.ac-ivan.is-thinking .think circle:nth-child(3){animation-delay:.4s}
svg.ac-ivan.is-talking .m-smile{opacity:0}
svg.ac-ivan.is-talking .m-open{opacity:1;animation:ac-talk .36s ease-in-out infinite}
svg.ac-ivan.is-talking .bob{animation:ac-breath 1.5s ease-in-out infinite}
svg.ac-ivan.is-happy .bob{animation:ac-hop .55s ease-out 2}
svg.ac-ivan.is-happy .eye{animation:none;transform:scaleY(.5)}
svg.ac-ivan.is-happy .cheek{opacity:1}
svg.ac-ivan.is-happy .m-smile{transform:scale(1.25)}
svg.ac-ivan.is-happy .spark{opacity:1;animation:ac-spark .9s ease-in-out 2}
@keyframes ac-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
@keyframes ac-blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes ac-tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}}
@keyframes ac-ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes ac-look{0%,100%{transform:translate(-1.6px,-1.6px)}50%{transform:translate(1.6px,-1.6px)}}
@keyframes ac-dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes ac-talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.15)}}
@keyframes ac-hop{0%{transform:translateY(0)}40%{transform:translateY(-3px) scale(1.03)}100%{transform:translateY(0)}}
@keyframes ac-spark{0%,100%{transform:scale(.6) rotate(0)}50%{transform:scale(1.15) rotate(20deg)}}
@keyframes ac-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){svg.ac-ivan *{animation:none!important;transition:none!important}}</style><circle cx="32" cy="32" r="32" fill="#dbeafe"/><g class="bob"><path d="M9 54C10 45 20 42 32 42S54 45 55 54A32 32 0 0 1 9 54Z" fill="#3b6fd8"/><path d="M26 42L32 49 38 42Z" fill="#f3f6ff"/><rect x="28" y="36" width="8" height="9" rx="3" fill="#dba87d"/><g class="head"><circle cx="17.6" cy="32" r="3" fill="#e8b48a"/><circle cx="46.4" cy="32" r="3" fill="#e8b48a"/><ellipse cx="32" cy="30.5" rx="14.2" ry="15.5" fill="#e8b48a"/><path d="M17.5 28C15 11 49 11 46.5 28 44 21.5 38 19.5 32 19.5S20 21.5 17.5 28Z" fill="#2b2230"/><path d="M24 25.5q3-2 6-.4M34 25.1q3-1.6 6 .4" stroke="#2b2230" stroke-width="1.6" fill="none" stroke-linecap="round"/><g class="eyes"><g class="eye"><ellipse cx="26" cy="31" rx="2.3" ry="2.9" fill="#2b2438"/><circle cx="26.8" cy="30" r=".85" fill="#fff"/></g><g class="eye"><ellipse cx="38" cy="31" rx="2.3" ry="2.9" fill="#2b2438"/><circle cx="38.8" cy="30" r=".85" fill="#fff"/></g></g><path class="m-smile" d="M28.6 39Q32 42.8 35.4 39" fill="none" stroke="#2b2438" stroke-width="1.6" stroke-linecap="round"/><ellipse class="m-open" cx="32" cy="40.2" rx="2.9" ry="2.7" fill="#6b2c3e"/></g></g><g class="think" fill="#3b6fd8"><circle cx="44" cy="9" r="2"/><circle cx="50" cy="12.5" r="2"/><circle cx="55" cy="18" r="2"/></g><g class="spark"><path d="M11 11L12.2 13.8L15 15L12.2 16.2L11 19L9.8 16.2L7 15L9.8 13.8Z" fill="#ffc933"/><path d="M53 7.8L53.96 10.04L56.2 11L53.96 11.96L53 14.2L52.04 11.96L49.8 11L52.04 10.04Z" fill="#ffc933"/></g></svg>
