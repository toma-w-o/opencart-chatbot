<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="ac-maria is-idle" focusable="false" aria-hidden="true"><style>
svg.ac-maria *{transform-box:fill-box}
svg.ac-maria .bob{transform-origin:50% 100%;animation:ac-breath 4.2s ease-in-out infinite}
svg.ac-maria .head{transform-origin:50% 100%}
svg.ac-maria .eye{transform-origin:50% 50%;animation:ac-blink 4.6s infinite}
svg.ac-maria .eyes{transform-origin:50% 50%}
svg.ac-maria .m-smile,svg.ac-maria .m-open{transform-origin:50% 50%}
svg.ac-maria .m-open{opacity:0;transform:scaleY(.2)}
svg.ac-maria .think,svg.ac-maria .spark{opacity:0}
svg.ac-maria .cheek{opacity:.55}
svg.ac-maria .ring{transform-origin:50% 50%;animation:ac-spin 9s linear infinite}
svg.ac-maria.is-listening .head{animation:ac-tilt 2.4s ease-in-out infinite}
svg.ac-maria.is-listening .eyes{transform:scale(1.08)}
svg.ac-maria.is-listening .ear{animation:ac-ear 1.2s ease-in-out infinite;transform-origin:50% 100%}
svg.ac-maria.is-thinking .eyes{animation:ac-look 2.4s ease-in-out infinite}
svg.ac-maria.is-thinking .m-smile{transform:scaleX(.55)}
svg.ac-maria.is-thinking .think{opacity:1}
svg.ac-maria.is-thinking .think circle{animation:ac-dot 1.2s ease-in-out infinite}
svg.ac-maria.is-thinking .think circle:nth-child(2){animation-delay:.2s}
svg.ac-maria.is-thinking .think circle:nth-child(3){animation-delay:.4s}
svg.ac-maria.is-talking .m-smile{opacity:0}
svg.ac-maria.is-talking .m-open{opacity:1;animation:ac-talk .36s ease-in-out infinite}
svg.ac-maria.is-talking .bob{animation:ac-breath 1.5s ease-in-out infinite}
svg.ac-maria.is-happy .bob{animation:ac-hop .55s ease-out 2}
svg.ac-maria.is-happy .eye{animation:none;transform:scaleY(.5)}
svg.ac-maria.is-happy .cheek{opacity:1}
svg.ac-maria.is-happy .m-smile{transform:scale(1.25)}
svg.ac-maria.is-happy .spark{opacity:1;animation:ac-spark .9s ease-in-out 2}
@keyframes ac-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
@keyframes ac-blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes ac-tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}}
@keyframes ac-ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes ac-look{0%,100%{transform:translate(-1.6px,-1.6px)}50%{transform:translate(1.6px,-1.6px)}}
@keyframes ac-dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes ac-talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.15)}}
@keyframes ac-hop{0%{transform:translateY(0)}40%{transform:translateY(-3px) scale(1.03)}100%{transform:translateY(0)}}
@keyframes ac-spark{0%,100%{transform:scale(.6) rotate(0)}50%{transform:scale(1.15) rotate(20deg)}}
@keyframes ac-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){svg.ac-maria *{animation:none!important;transition:none!important}}</style><circle cx="32" cy="32" r="32" fill="#ffe3ec"/><g class="bob"><path d="M9 54C10 45 20 42 32 42S54 45 55 54A32 32 0 0 1 9 54Z" fill="#2fa4a0"/><rect x="28" y="36" width="8" height="9" rx="3" fill="#eebb94"/><g class="head"><path d="M12 31C12 12 52 12 52 31L53 47 11 47Z" fill="#6b3f2a"/><ellipse cx="32" cy="30" rx="14" ry="15.5" fill="#f6c9a4"/><path d="M17.5 29C16 12 46 10 46.5 29 42 22 30 19 23 24 20 26 18.5 28 17.5 29Z" fill="#6b3f2a"/><ellipse class="cheek" cx="22.4" cy="37.6" rx="2.6" ry="1.7" fill="#ff8fa3"/><ellipse class="cheek" cx="41.6" cy="37.6" rx="2.6" ry="1.7" fill="#ff8fa3"/><g class="eyes"><g class="eye"><ellipse cx="26" cy="32" rx="2.3" ry="2.9" fill="#2b2438"/><circle cx="26.8" cy="31" r=".85" fill="#fff"/></g><g class="eye"><ellipse cx="38" cy="32" rx="2.3" ry="2.9" fill="#2b2438"/><circle cx="38.8" cy="31" r=".85" fill="#fff"/></g></g><path class="m-smile" d="M28.6 39.2Q32 43 35.4 39.2" fill="none" stroke="#2b2438" stroke-width="1.6" stroke-linecap="round"/><ellipse class="m-open" cx="32" cy="40.400000000000006" rx="2.9" ry="2.7" fill="#6b2c3e"/></g></g><g class="think" fill="#e0587f"><circle cx="44" cy="9" r="2"/><circle cx="50" cy="12.5" r="2"/><circle cx="55" cy="18" r="2"/></g><g class="spark"><path d="M11 11L12.2 13.8L15 15L12.2 16.2L11 19L9.8 16.2L7 15L9.8 13.8Z" fill="#ffc933"/><path d="M53 7.8L53.96 10.04L56.2 11L53.96 11.96L53 14.2L52.04 11.96L49.8 11L52.04 10.04Z" fill="#ffc933"/></g></svg>
