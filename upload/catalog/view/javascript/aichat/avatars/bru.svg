<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="ac-bru is-idle" focusable="false" aria-hidden="true"><style>
svg.ac-bru *{transform-box:fill-box}
svg.ac-bru .bob{transform-origin:50% 100%;animation:ac-breath 4.2s ease-in-out infinite}
svg.ac-bru .head{transform-origin:50% 100%}
svg.ac-bru .eye{transform-origin:50% 50%;animation:ac-blink 4.6s infinite}
svg.ac-bru .eyes{transform-origin:50% 50%}
svg.ac-bru .m-smile,svg.ac-bru .m-open{transform-origin:50% 50%}
svg.ac-bru .m-open{opacity:0;transform:scaleY(.2)}
svg.ac-bru .think,svg.ac-bru .spark{opacity:0}
svg.ac-bru .cheek{opacity:.55}
svg.ac-bru .ring{transform-origin:50% 50%;animation:ac-spin 9s linear infinite}
svg.ac-bru.is-listening .head{animation:ac-tilt 2.4s ease-in-out infinite}
svg.ac-bru.is-listening .eyes{transform:scale(1.08)}
svg.ac-bru.is-listening .ear{animation:ac-ear 1.2s ease-in-out infinite;transform-origin:50% 100%}
svg.ac-bru.is-thinking .eyes{animation:ac-look 2.4s ease-in-out infinite}
svg.ac-bru.is-thinking .m-smile{transform:scaleX(.55)}
svg.ac-bru.is-thinking .think{opacity:1}
svg.ac-bru.is-thinking .think circle{animation:ac-dot 1.2s ease-in-out infinite}
svg.ac-bru.is-thinking .think circle:nth-child(2){animation-delay:.2s}
svg.ac-bru.is-thinking .think circle:nth-child(3){animation-delay:.4s}
svg.ac-bru.is-talking .m-smile{opacity:0}
svg.ac-bru.is-talking .m-open{opacity:1;animation:ac-talk .36s ease-in-out infinite}
svg.ac-bru.is-talking .bob{animation:ac-breath 1.5s ease-in-out infinite}
svg.ac-bru.is-happy .bob{animation:ac-hop .55s ease-out 2}
svg.ac-bru.is-happy .eye{animation:none;transform:scaleY(.5)}
svg.ac-bru.is-happy .cheek{opacity:1}
svg.ac-bru.is-happy .m-smile{transform:scale(1.25)}
svg.ac-bru.is-happy .spark{opacity:1;animation:ac-spark .9s ease-in-out 2}
@keyframes ac-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
@keyframes ac-blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes ac-tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}}
@keyframes ac-ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes ac-look{0%,100%{transform:translate(-1.6px,-1.6px)}50%{transform:translate(1.6px,-1.6px)}}
@keyframes ac-dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes ac-talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.15)}}
@keyframes ac-hop{0%{transform:translateY(0)}40%{transform:translateY(-3px) scale(1.03)}100%{transform:translateY(0)}}
@keyframes ac-spark{0%,100%{transform:scale(.6) rotate(0)}50%{transform:scale(1.15) rotate(20deg)}}
@keyframes ac-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){svg.ac-bru *{animation:none!important;transition:none!important}}</style><circle cx="32" cy="32" r="32" fill="#fff0c9"/><g class="bob"><path d="M9 54C10 45 20 42 32 42S54 45 55 54A32 32 0 0 1 9 54Z" fill="#a9703f"/><path d="M24 43Q32 49 40 43L38 47Q32 51 26 47Z" fill="#e04f5f"/><g class="head"><g class="ear"><circle cx="17" cy="17.5" r="6.5" fill="#a9703f"/><circle cx="17" cy="17.5" r="3.4" fill="#e7c29a"/></g><g class="ear"><circle cx="47" cy="17.5" r="6.5" fill="#a9703f"/><circle cx="47" cy="17.5" r="3.4" fill="#e7c29a"/></g><circle cx="32" cy="31" r="17.5" fill="#a9703f"/><ellipse cx="32" cy="37.5" rx="8.5" ry="6.4" fill="#e7c29a"/><g class="eyes"><g class="eye"><ellipse cx="24.2" cy="29.5" rx="2.3" ry="2.9" fill="#241a16"/><circle cx="25" cy="28.5" r=".85" fill="#fff"/></g><g class="eye"><ellipse cx="39.8" cy="29.5" rx="2.3" ry="2.9" fill="#241a16"/><circle cx="40.599999999999994" cy="28.5" r=".85" fill="#fff"/></g></g><path class="m-smile" d="M28.6 40Q32 43.8 35.4 40" fill="none" stroke="#2b2438" stroke-width="1.6" stroke-linecap="round"/><ellipse class="m-open" cx="32" cy="41.2" rx="2.9" ry="2.7" fill="#6b2c3e"/><ellipse cx="32" cy="35" rx="2.8" ry="1.9" fill="#3a2418"/></g></g><g class="think" fill="#a9703f"><circle cx="44" cy="9" r="2"/><circle cx="50" cy="12.5" r="2"/><circle cx="55" cy="18" r="2"/></g><g class="spark"><path d="M11 11L12.2 13.8L15 15L12.2 16.2L11 19L9.8 16.2L7 15L9.8 13.8Z" fill="#ffc933"/><path d="M53 7.8L53.96 10.04L56.2 11L53.96 11.96L53 14.2L52.04 11.96L49.8 11L52.04 10.04Z" fill="#ffc933"/></g></svg>
