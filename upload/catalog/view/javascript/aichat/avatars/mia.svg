<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="ac-mia is-idle" focusable="false" aria-hidden="true"><style>
svg.ac-mia *{transform-box:fill-box}
svg.ac-mia .bob{transform-origin:50% 100%;animation:ac-breath 4.2s ease-in-out infinite}
svg.ac-mia .head{transform-origin:50% 100%}
svg.ac-mia .eye{transform-origin:50% 50%;animation:ac-blink 4.6s infinite}
svg.ac-mia .eyes{transform-origin:50% 50%}
svg.ac-mia .m-smile,svg.ac-mia .m-open{transform-origin:50% 50%}
svg.ac-mia .m-open{opacity:0;transform:scaleY(.2)}
svg.ac-mia .think,svg.ac-mia .spark{opacity:0}
svg.ac-mia .cheek{opacity:.55}
svg.ac-mia .ring{transform-origin:50% 50%;animation:ac-spin 9s linear infinite}
svg.ac-mia.is-listening .head{animation:ac-tilt 2.4s ease-in-out infinite}
svg.ac-mia.is-listening .eyes{transform:scale(1.08)}
svg.ac-mia.is-listening .ear{animation:ac-ear 1.2s ease-in-out infinite;transform-origin:50% 100%}
svg.ac-mia.is-thinking .eyes{animation:ac-look 2.4s ease-in-out infinite}
svg.ac-mia.is-thinking .m-smile{transform:scaleX(.55)}
svg.ac-mia.is-thinking .think{opacity:1}
svg.ac-mia.is-thinking .think circle{animation:ac-dot 1.2s ease-in-out infinite}
svg.ac-mia.is-thinking .think circle:nth-child(2){animation-delay:.2s}
svg.ac-mia.is-thinking .think circle:nth-child(3){animation-delay:.4s}
svg.ac-mia.is-talking .m-smile{opacity:0}
svg.ac-mia.is-talking .m-open{opacity:1;animation:ac-talk .36s ease-in-out infinite}
svg.ac-mia.is-talking .bob{animation:ac-breath 1.5s ease-in-out infinite}
svg.ac-mia.is-happy .bob{animation:ac-hop .55s ease-out 2}
svg.ac-mia.is-happy .eye{animation:none;transform:scaleY(.5)}
svg.ac-mia.is-happy .cheek{opacity:1}
svg.ac-mia.is-happy .m-smile{transform:scale(1.25)}
svg.ac-mia.is-happy .spark{opacity:1;animation:ac-spark .9s ease-in-out 2}
@keyframes ac-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
@keyframes ac-blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes ac-tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}}
@keyframes ac-ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes ac-look{0%,100%{transform:translate(-1.6px,-1.6px)}50%{transform:translate(1.6px,-1.6px)}}
@keyframes ac-dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes ac-talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.15)}}
@keyframes ac-hop{0%{transform:translateY(0)}40%{transform:translateY(-3px) scale(1.03)}100%{transform:translateY(0)}}
@keyframes ac-spark{0%,100%{transform:scale(.6) rotate(0)}50%{transform:scale(1.15) rotate(20deg)}}
@keyframes ac-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){svg.ac-mia *{animation:none!important;transition:none!important}}</style><circle cx="32" cy="32" r="32" fill="#ffe9d6"/><g class="bob"><path d="M9 54C10 45 20 42 32 42S54 45 55 54A32 32 0 0 1 9 54Z" fill="#f2a65a"/><g class="head"><path class="ear" d="M14 28L13 8 28 18Z" fill="#f2a65a"/><path class="ear" d="M50 28L51 8 36 18Z" fill="#f2a65a"/><path d="M17 23L16.6 12.5 24 17.5Z" fill="#ffb3c1"/><path d="M47 23L47.4 12.5 40 17.5Z" fill="#ffb3c1"/><ellipse cx="32" cy="31" rx="18" ry="15" fill="#f2a65a"/><path d="M32 17v5M27 18.5l1 4M37 18.5l-1 4" stroke="#d9823a" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="32" cy="38" rx="8" ry="5.4" fill="#fff4e6"/><g class="eyes"><g class="eye"><ellipse cx="24" cy="30.5" rx="2.3" ry="2.9" fill="#2b2438"/><circle cx="24.8" cy="29.5" r=".85" fill="#fff"/></g><g class="eye"><ellipse cx="40" cy="30.5" rx="2.3" ry="2.9" fill="#2b2438"/><circle cx="40.8" cy="29.5" r=".85" fill="#fff"/></g></g><path class="m-smile" d="M28.6 39.4Q32 43.199999999999996 35.4 39.4" fill="none" stroke="#2b2438" stroke-width="1.6" stroke-linecap="round"/><ellipse class="m-open" cx="32" cy="40.6" rx="2.9" ry="2.7" fill="#6b2c3e"/><path d="M30.2 35.6h3.6L32 37.6Z" fill="#e8607a"/><path d="M19 36.5l-7-1.2M19 39l-7 2M45 36.5l7-1.2M45 39l7 2" stroke="#b86a28" stroke-width="1" stroke-linecap="round"/></g></g><g class="think" fill="#e08a3a"><circle cx="44" cy="9" r="2"/><circle cx="50" cy="12.5" r="2"/><circle cx="55" cy="18" r="2"/></g><g class="spark"><path d="M11 11L12.2 13.8L15 15L12.2 16.2L11 19L9.8 16.2L7 15L9.8 13.8Z" fill="#ffc933"/><path d="M53 7.8L53.96 10.04L56.2 11L53.96 11.96L53 14.2L52.04 11.96L49.8 11L52.04 10.04Z" fill="#ffc933"/></g></svg>
