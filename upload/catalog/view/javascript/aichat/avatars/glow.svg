<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="ac-glow is-idle" focusable="false" aria-hidden="true"><style>
svg.ac-glow *{transform-box:fill-box}
svg.ac-glow .bob{transform-origin:50% 100%;animation:ac-breath 4.2s ease-in-out infinite}
svg.ac-glow .head{transform-origin:50% 100%}
svg.ac-glow .eye{transform-origin:50% 50%;animation:ac-blink 4.6s infinite}
svg.ac-glow .eyes{transform-origin:50% 50%}
svg.ac-glow .m-smile,svg.ac-glow .m-open{transform-origin:50% 50%}
svg.ac-glow .m-open{opacity:0;transform:scaleY(.2)}
svg.ac-glow .think,svg.ac-glow .spark{opacity:0}
svg.ac-glow .cheek{opacity:.55}
svg.ac-glow .ring{transform-origin:50% 50%;animation:ac-spin 9s linear infinite}
svg.ac-glow.is-listening .head{animation:ac-tilt 2.4s ease-in-out infinite}
svg.ac-glow.is-listening .eyes{transform:scale(1.08)}
svg.ac-glow.is-listening .ear{animation:ac-ear 1.2s ease-in-out infinite;transform-origin:50% 100%}
svg.ac-glow.is-thinking .eyes{animation:ac-look 2.4s ease-in-out infinite}
svg.ac-glow.is-thinking .m-smile{transform:scaleX(.55)}
svg.ac-glow.is-thinking .think{opacity:1}
svg.ac-glow.is-thinking .think circle{animation:ac-dot 1.2s ease-in-out infinite}
svg.ac-glow.is-thinking .think circle:nth-child(2){animation-delay:.2s}
svg.ac-glow.is-thinking .think circle:nth-child(3){animation-delay:.4s}
svg.ac-glow.is-talking .m-smile{opacity:0}
svg.ac-glow.is-talking .m-open{opacity:1;animation:ac-talk .36s ease-in-out infinite}
svg.ac-glow.is-talking .bob{animation:ac-breath 1.5s ease-in-out infinite}
svg.ac-glow.is-happy .bob{animation:ac-hop .55s ease-out 2}
svg.ac-glow.is-happy .eye{animation:none;transform:scaleY(.5)}
svg.ac-glow.is-happy .cheek{opacity:1}
svg.ac-glow.is-happy .m-smile{transform:scale(1.25)}
svg.ac-glow.is-happy .spark{opacity:1;animation:ac-spark .9s ease-in-out 2}
@keyframes ac-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
@keyframes ac-blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes ac-tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}}
@keyframes ac-ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes ac-look{0%,100%{transform:translate(-1.6px,-1.6px)}50%{transform:translate(1.6px,-1.6px)}}
@keyframes ac-dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes ac-talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.15)}}
@keyframes ac-hop{0%{transform:translateY(0)}40%{transform:translateY(-3px) scale(1.03)}100%{transform:translateY(0)}}
@keyframes ac-spark{0%,100%{transform:scale(.6) rotate(0)}50%{transform:scale(1.15) rotate(20deg)}}
@keyframes ac-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){svg.ac-glow *{animation:none!important;transition:none!important}}</style><circle cx="32" cy="32" r="32" fill="#241f5a"/><g class="bob"><circle cx="32" cy="33" r="25" fill="#7c5cff" opacity=".22"/><circle cx="32" cy="33" r="21" fill="#7c5cff" opacity=".35"/><circle cx="32" cy="33" r="17" fill="#9b8cff"/><circle cx="32" cy="33" r="13" fill="#cfc6ff"/><ellipse cx="26" cy="26" rx="4" ry="2.6" fill="#fff" opacity=".7" transform="rotate(-30 26 26)"/><g class="head"><g class="ring"><ellipse cx="32" cy="33" rx="27" ry="8" fill="none" stroke="#ffd45c" stroke-width="1.2" opacity=".8" transform="rotate(-20 32 33)"/><circle cx="58" cy="29" r="2.2" fill="#ffd45c"/></g><ellipse class="cheek" cx="23.4" cy="38.6" rx="2.6" ry="1.7" fill="#ff8fb5"/><ellipse class="cheek" cx="40.6" cy="38.6" rx="2.6" ry="1.7" fill="#ff8fb5"/><g class="eyes"><g class="eye"><ellipse cx="27" cy="33" rx="2.3" ry="2.9" fill="#2b2060"/></g><g class="eye"><ellipse cx="37" cy="33" rx="2.3" ry="2.9" fill="#2b2060"/></g></g><path class="m-smile" d="M28.6 38Q32 41.8 35.4 38" fill="none" stroke="#2b2060" stroke-width="1.6" stroke-linecap="round"/><ellipse class="m-open" cx="32" cy="39.2" rx="2.9" ry="2.7" fill="#2b2060"/></g></g><g class="think" fill="#cfc6ff"><circle cx="44" cy="9" r="2"/><circle cx="50" cy="12.5" r="2"/><circle cx="55" cy="18" r="2"/></g><g class="spark"><path d="M11 11L12.2 13.8L15 15L12.2 16.2L11 19L9.8 16.2L7 15L9.8 13.8Z" fill="#ffc933"/><path d="M53 7.8L53.96 10.04L56.2 11L53.96 11.96L53 14.2L52.04 11.96L49.8 11L52.04 10.04Z" fill="#ffc933"/></g></svg>
