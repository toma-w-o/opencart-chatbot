<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="ac-robot is-idle" focusable="false" aria-hidden="true"><style>
svg.ac-robot *{transform-box:fill-box}
svg.ac-robot .bob{transform-origin:50% 100%;animation:ac-breath 4.2s ease-in-out infinite}
svg.ac-robot .head{transform-origin:50% 100%}
svg.ac-robot .eye{transform-origin:50% 50%;animation:ac-blink 4.6s infinite}
svg.ac-robot .eyes{transform-origin:50% 50%}
svg.ac-robot .m-smile,svg.ac-robot .m-open{transform-origin:50% 50%}
svg.ac-robot .m-open{opacity:0;transform:scaleY(.2)}
svg.ac-robot .think,svg.ac-robot .spark{opacity:0}
svg.ac-robot .cheek{opacity:.55}
svg.ac-robot .ring{transform-origin:50% 50%;animation:ac-spin 9s linear infinite}
svg.ac-robot.is-listening .head{animation:ac-tilt 2.4s ease-in-out infinite}
svg.ac-robot.is-listening .eyes{transform:scale(1.08)}
svg.ac-robot.is-listening .ear{animation:ac-ear 1.2s ease-in-out infinite;transform-origin:50% 100%}
svg.ac-robot.is-thinking .eyes{animation:ac-look 2.4s ease-in-out infinite}
svg.ac-robot.is-thinking .m-smile{transform:scaleX(.55)}
svg.ac-robot.is-thinking .think{opacity:1}
svg.ac-robot.is-thinking .think circle{animation:ac-dot 1.2s ease-in-out infinite}
svg.ac-robot.is-thinking .think circle:nth-child(2){animation-delay:.2s}
svg.ac-robot.is-thinking .think circle:nth-child(3){animation-delay:.4s}
svg.ac-robot.is-talking .m-smile{opacity:0}
svg.ac-robot.is-talking .m-open{opacity:1;animation:ac-talk .36s ease-in-out infinite}
svg.ac-robot.is-talking .bob{animation:ac-breath 1.5s ease-in-out infinite}
svg.ac-robot.is-happy .bob{animation:ac-hop .55s ease-out 2}
svg.ac-robot.is-happy .eye{animation:none;transform:scaleY(.5)}
svg.ac-robot.is-happy .cheek{opacity:1}
svg.ac-robot.is-happy .m-smile{transform:scale(1.25)}
svg.ac-robot.is-happy .spark{opacity:1;animation:ac-spark .9s ease-in-out 2}
@keyframes ac-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
@keyframes ac-blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes ac-tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}}
@keyframes ac-ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
@keyframes ac-look{0%,100%{transform:translate(-1.6px,-1.6px)}50%{transform:translate(1.6px,-1.6px)}}
@keyframes ac-dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes ac-talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.15)}}
@keyframes ac-hop{0%{transform:translateY(0)}40%{transform:translateY(-3px) scale(1.03)}100%{transform:translateY(0)}}
@keyframes ac-spark{0%,100%{transform:scale(.6) rotate(0)}50%{transform:scale(1.15) rotate(20deg)}}
@keyframes ac-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){svg.ac-robot *{animation:none!important;transition:none!important}}</style><circle cx="32" cy="32" r="32" fill="#e4e1ff"/><g class="bob"><path d="M9 54C10 46 20 43 32 43S54 46 55 54A32 32 0 0 1 9 54Z" fill="#8a8fa8"/><rect x="26" y="38" width="12" height="7" rx="2" fill="#6c7190"/><g class="head"><rect class="ear" x="9.5" y="27" width="5" height="11" rx="2.5" fill="#6a5cf0"/><rect class="ear" x="49.5" y="27" width="5" height="11" rx="2.5" fill="#6a5cf0"/><path d="M32 17V10" stroke="#6c7190" stroke-width="2" stroke-linecap="round"/><circle cx="32" cy="8.6" r="3" fill="#ffc933"/><rect x="13.5" y="16" width="37" height="29" rx="11" fill="#dfe4f2"/><rect x="18" y="20.5" width="28" height="20" rx="7.5" fill="#1f2640"/><g class="eyes"><g class="eye"><ellipse cx="25" cy="28.2" rx="2.5" ry="3.1" fill="#6cf0ff"/></g><g class="eye"><ellipse cx="39" cy="28.2" rx="2.5" ry="3.1" fill="#6cf0ff"/></g></g><path class="m-smile" d="M28.6 34.6Q32 38.4 35.4 34.6" fill="none" stroke="#6cf0ff" stroke-width="1.6" stroke-linecap="round"/><ellipse class="m-open" cx="32" cy="35.800000000000004" rx="2.9" ry="2.7" fill="#6cf0ff"/></g></g><g class="think" fill="#6a5cf0"><circle cx="44" cy="9" r="2"/><circle cx="50" cy="12.5" r="2"/><circle cx="55" cy="18" r="2"/></g><g class="spark"><path d="M11 11L12.2 13.8L15 15L12.2 16.2L11 19L9.8 16.2L7 15L9.8 13.8Z" fill="#ffc933"/><path d="M53 7.8L53.96 10.04L56.2 11L53.96 11.96L53 14.2L52.04 11.96L49.8 11L52.04 10.04Z" fill="#ffc933"/></g></svg>
