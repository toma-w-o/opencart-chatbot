<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="ac-pixo is-idle" data-gestures="6" focusable="false" aria-hidden="true"><style>svg.ac-pixo{--tilt:6deg;--spd:0.96;--b0:0}
svg.ac-pixo *{transform-box:fill-box;transform-origin:50% 50%}
svg.ac-pixo .bob{transform-origin:50% 100%;animation:ac-breath 4.2s ease-in-out infinite}
svg.ac-pixo .head{transform-origin:50% 100%;animation:ac-sway 6.5s ease-in-out infinite}
svg.ac-pixo .face{animation:ac-face 9s ease-in-out infinite}
svg.ac-pixo .look{animation:ac-look 9s ease-in-out infinite}
svg.ac-pixo .eye{animation:ac-blink 4.8s infinite}
svg.ac-pixo .ant{transform-origin:50% 100%}
svg.ac-pixo .e-happy,svg.ac-pixo .e-heart,svg.ac-pixo .e-star,svg.ac-pixo .m-big,svg.ac-pixo .m-o,svg.ac-pixo .m-open,svg.ac-pixo .hearts,svg.ac-pixo .spark,svg.ac-pixo .think{opacity:0}
svg.ac-pixo .brow{opacity:0}
svg.ac-pixo .m-open{transform:scaleY(.3)}
svg.ac-pixo .ear{transform-origin:50% 50%}
svg.ac-pixo .think circle{fill:#7dff6a}
svg.ac-pixo .spark path{fill:#7dff6a}
/* states */
svg.ac-pixo.is-listening .head{animation:ac-tilt 2.4s ease-in-out infinite}
svg.ac-pixo.is-listening .look,svg.ac-pixo.is-listening .face{animation:none}
svg.ac-pixo.is-listening .eyes{transform:scale(1.12)}
svg.ac-pixo.is-listening .brow{opacity:1;transform:translateY(-1px)}
svg.ac-pixo.is-listening .ear{animation:ac-ear 1.1s ease-in-out infinite}
svg.ac-pixo.is-listening .ant{animation:ac-antwig 1.6s ease-in-out infinite}
svg.ac-pixo.is-thinking .head{animation:ac-think-head 2.8s ease-in-out infinite}
svg.ac-pixo.is-thinking .look{animation:ac-think-look 2.6s ease-in-out infinite}
svg.ac-pixo.is-thinking .face{animation:ac-think-face 2.6s ease-in-out infinite}
svg.ac-pixo.is-thinking .m-smile{transform:scaleX(.5) translateX(2px)}
svg.ac-pixo.is-thinking .browR{opacity:1;transform:translateY(-1.8px) rotate(-8deg)}
svg.ac-pixo.is-thinking .browL{opacity:1;transform:translateY(.4px)}
svg.ac-pixo.is-thinking .think{opacity:1}
svg.ac-pixo.is-thinking .think circle{animation:ac-dot 1.2s ease-in-out infinite}
svg.ac-pixo.is-thinking .think circle:nth-child(2){animation-delay:.2s}
svg.ac-pixo.is-thinking .think circle:nth-child(3){animation-delay:.4s}
svg.ac-pixo.is-thinking .tip{animation:ac-glow 1s ease-in-out infinite}
svg.ac-pixo.is-talking .bob{animation:ac-talkbob .9s ease-in-out infinite}
svg.ac-pixo.is-talking .head{animation:ac-nod 1.4s ease-in-out infinite}
svg.ac-pixo.is-talking .face{animation:none}
svg.ac-pixo.is-talking .m-smile{opacity:0}
svg.ac-pixo.is-talking .m-open{opacity:1;animation:ac-talk .34s ease-in-out infinite}
svg.ac-pixo.is-talking .bar:nth-child(1){animation:ac-bar .3s ease-in-out infinite}
svg.ac-pixo.is-talking .bar:nth-child(2){animation:ac-bar .24s ease-in-out infinite .06s}
svg.ac-pixo.is-talking .bar:nth-child(3){animation:ac-bar .36s ease-in-out infinite .12s}
svg.ac-pixo.is-talking .ear{animation:ac-earpulse .5s ease-in-out infinite}
svg.ac-pixo.is-talking .ant{animation:ac-antwig 1.2s ease-in-out infinite}
svg.ac-pixo.is-happy .bob{animation:ac-hop .6s ease-out 2}
svg.ac-pixo.is-happy .head{animation:ac-sway 1.2s ease-in-out infinite}
svg.ac-pixo.is-happy .e-base{opacity:0}
svg.ac-pixo.is-happy .e-happy{opacity:1}
svg.ac-pixo.is-happy .eye{animation:none}
svg.ac-pixo.is-happy .m-smile{opacity:0}
svg.ac-pixo.is-happy .m-big{opacity:1}
svg.ac-pixo.is-happy .cheek{opacity:1}
svg.ac-pixo.is-happy .spark{opacity:1;animation:ac-twinkle .9s ease-in-out 2}
svg.ac-pixo.is-happy .ant{animation:ac-wave 1.4s ease-in-out 1}
/* attention gestures */
svg.ac-pixo.is-attn-1 .bob{animation:ac-g1-bob calc(1.7s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-1 .head{animation:ac-g1-head calc(1.7s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-1 .eyeR .e-base{animation:ac-outmid calc(1.7s * var(--spd)) 1}
svg.ac-pixo.is-attn-1 .eyeR .e-happy{animation:ac-inmid calc(1.7s * var(--spd)) 1}
svg.ac-pixo.is-attn-1 .eyeR .eye{animation:none}
svg.ac-pixo.is-attn-1 .m-smile{animation:ac-g1-smile calc(1.7s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-1 .cheek{animation:ac-cheek calc(1.7s * var(--spd)) 1}
svg.ac-pixo.is-attn-1 .spark{animation:ac-sparkmid calc(1.7s * var(--spd)) 1}
svg.ac-pixo.is-attn-2 .bob{animation:ac-g2-bob calc(1.9s * var(--spd)) ease-out 1}
svg.ac-pixo.is-attn-2 .eyes{animation:ac-g2-eyes calc(1.9s * var(--spd)) ease-out 1}
svg.ac-pixo.is-attn-2 .brow{animation:ac-g2-brow calc(1.9s * var(--spd)) ease-out 1}
svg.ac-pixo.is-attn-2 .m-smile{animation:ac-outmid calc(1.9s * var(--spd)) 1}
svg.ac-pixo.is-attn-2 .m-o{animation:ac-inmid calc(1.9s * var(--spd)) 1}
svg.ac-pixo.is-attn-2 .ant{animation:ac-jolt calc(1.9s * var(--spd)) ease-out 1}
svg.ac-pixo.is-attn-2 .ear{animation:ac-earpop calc(1.9s * var(--spd)) ease-out 1}
svg.ac-pixo.is-attn-3 .bob{animation:ac-laugh .3s ease-in-out 6}
svg.ac-pixo.is-attn-3 .head{animation:ac-wobble .6s ease-in-out 3}
svg.ac-pixo.is-attn-3 .e-base{animation:ac-outmid calc(1.8s * var(--spd)) 1}
svg.ac-pixo.is-attn-3 .e-happy{animation:ac-inmid calc(1.8s * var(--spd)) 1}
svg.ac-pixo.is-attn-3 .eye{animation:none}
svg.ac-pixo.is-attn-3 .m-smile{animation:ac-outmid calc(1.8s * var(--spd)) 1}
svg.ac-pixo.is-attn-3 .m-big{animation:ac-inmid calc(1.8s * var(--spd)) 1}
svg.ac-pixo.is-attn-3 .mouth{animation:ac-jaw .3s ease-in-out 6}
svg.ac-pixo.is-attn-3 .cheek{animation:ac-cheek calc(1.8s * var(--spd)) 1}
svg.ac-pixo.is-attn-3 .ear{animation:ac-earpulse .3s ease-in-out 6}
svg.ac-pixo.is-attn-4 .bob{animation:ac-g4-bob calc(2s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-4 .head{animation:ac-lovesway calc(2s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-4 .e-base{animation:ac-outmid calc(2s * var(--spd)) 1}
svg.ac-pixo.is-attn-4 .e-heart{animation:ac-inmid calc(2s * var(--spd)) 1,ac-beat .5s ease-in-out 3}
svg.ac-pixo.is-attn-4 .eye{animation:none}
svg.ac-pixo.is-attn-4 .hearts{animation:ac-inmid calc(2s * var(--spd)) 1}
svg.ac-pixo.is-attn-4 .hearts path{animation:ac-heartup 1.1s ease-out 1 both}
svg.ac-pixo.is-attn-4 .hearts path:nth-child(2){animation-delay:.35s}
svg.ac-pixo.is-attn-4 .hearts path:nth-child(3){animation-delay:.7s}
svg.ac-pixo.is-attn-4 .m-smile{animation:ac-g1-smile calc(2s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-4 .cheek{animation:ac-cheek calc(2s * var(--spd)) 1}
svg.ac-pixo.is-attn-5 .head{animation:ac-g5-head calc(2.2s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-5 .look{animation:ac-g5-look calc(2.2s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-5 .face{animation:ac-g5-face calc(2.2s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-5 .browR{animation:ac-g5-brow calc(2.2s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-5 .m-smile{animation:ac-g5-mouth calc(2.2s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-5 .bob{animation:ac-g5-bob calc(2.2s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-6 .bob{animation:ac-g6-bob calc(2s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-6 .ant{animation:ac-wave calc(1.5s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-6 .tip{animation:ac-glow .5s ease-in-out 3}
svg.ac-pixo.is-attn-6 .e-base{animation:ac-outmid calc(2s * var(--spd)) 1}
svg.ac-pixo.is-attn-6 .e-star{animation:ac-inmid calc(2s * var(--spd)) 1,ac-twinkle .6s ease-in-out 3}
svg.ac-pixo.is-attn-6 .eye{animation:none}
svg.ac-pixo.is-attn-6 .spark{animation:ac-sparkmid calc(2s * var(--spd)) 1}
svg.ac-pixo.is-attn-6 .m-smile{animation:ac-g1-smile calc(2s * var(--spd)) ease-in-out 1}
svg.ac-pixo.is-attn-6 .head{animation:ac-g6-head calc(2s * var(--spd)) ease-in-out 1}
@keyframes ac-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(.99,1.035)}}
@keyframes ac-sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes ac-blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}96%{transform:scaleY(1)}}
@keyframes ac-look{0%,10%,44%,100%{transform:translate(0,0)}16%,32%{transform:translate(-2.2px,-.6px)}50%,64%{transform:translate(2.4px,.5px)}70%,76%{transform:translate(.6px,-1.6px)}82%{transform:translate(0,0)}}
@keyframes ac-face{0%,10%,44%,100%{transform:translate(0,0)}16%,32%{transform:translate(-.9px,-.2px)}50%,64%{transform:translate(1px,.2px)}70%,76%{transform:translate(.3px,-.6px)}82%{transform:translate(0,0)}}
@keyframes ac-tilt{0%,100%{transform:rotate(calc(var(--tilt) * -.6))}50%{transform:rotate(calc(var(--tilt) * .5))}}
@keyframes ac-ear{0%,100%{transform:scale(1,1)}50%{transform:scale(1.14,1.22)}}
@keyframes ac-earpulse{0%,100%{transform:scale(1,1)}50%{transform:scale(1.12,1.1)}}
@keyframes ac-earpop{0%,15%{transform:scale(1)}25%,65%{transform:scale(1.25,1.3)}100%{transform:scale(1)}}
@keyframes ac-antwig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes ac-think-head{0%,100%{transform:rotate(calc(var(--tilt) * -.6))}50%{transform:rotate(calc(var(--tilt) * -.25))}}
@keyframes ac-think-look{0%,100%{transform:translate(-2.4px,-2.4px)}50%{transform:translate(2.4px,-2.6px)}}
@keyframes ac-think-face{0%,100%{transform:translate(-1px,-.8px)}50%{transform:translate(1px,-.9px)}}
@keyframes ac-dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
@keyframes ac-glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
@keyframes ac-talk{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1.12)}}
@keyframes ac-bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1.2)}}
@keyframes ac-talkbob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-.9px) scale(.99,1.02)}}
@keyframes ac-nod{0%,100%{transform:rotate(-1.8deg)}25%{transform:rotate(1.6deg)}50%{transform:rotate(-.6deg)}75%{transform:rotate(1.8deg)}}
@keyframes ac-hop{0%{transform:translateY(0) scale(1.05,.93)}35%{transform:translateY(-3.6px) scale(.95,1.08)}70%{transform:translateY(0) scale(1.05,.94)}100%{transform:translateY(0) scale(1,1)}}
@keyframes ac-twinkle{0%,100%{transform:scale(.55) rotate(0)}50%{transform:scale(1.2) rotate(25deg)}}
@keyframes ac-wave{0%{transform:rotate(0)}15%{transform:rotate(24deg)}32%{transform:rotate(-20deg)}50%{transform:rotate(15deg)}68%{transform:rotate(-9deg)}84%{transform:rotate(4deg)}100%{transform:rotate(0)}}
@keyframes ac-jolt{0%,12%{transform:rotate(0)}20%{transform:rotate(-26deg)}32%{transform:rotate(18deg)}46%{transform:rotate(-10deg)}62%{transform:rotate(5deg)}100%{transform:rotate(0)}}
@keyframes ac-cheek{0%,8%{transform:scale(1)}16%,84%{transform:scale(1.4)}92%,100%{transform:scale(1)}}
@keyframes ac-outmid{0%,8%{opacity:1}16%,84%{opacity:0}92%,100%{opacity:1}}
@keyframes ac-inmid{0%,8%{opacity:0}16%,84%{opacity:1}92%,100%{opacity:0}}
@keyframes ac-sparkmid{0%,8%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.2) rotate(20deg)}34%{transform:scale(.8) rotate(0)}50%{transform:scale(1.15) rotate(20deg)}66%{transform:scale(.85)}84%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.4)}}
@keyframes ac-g1-bob{0%,10%{transform:translateY(0) scale(1,1)}22%{transform:translateY(0) scale(1.04,.95)}36%{transform:translateY(-2px) scale(.97,1.05)}52%{transform:translateY(0) scale(1.02,.98)}100%{transform:translateY(0) scale(1,1)}}
@keyframes ac-g1-head{0%,10%{transform:rotate(0)}26%,70%{transform:rotate(calc(var(--tilt) * -1.1))}100%{transform:rotate(0)}}
@keyframes ac-g1-smile{0%,10%{transform:scale(1)}24%,72%{transform:scale(1.3) translateY(.6px)}100%{transform:scale(1)}}
@keyframes ac-g2-bob{0%{transform:scale(1,1)}8%{transform:scale(1.1,.88)}20%{transform:translateY(-2.4px) scale(.9,1.14)}34%{transform:translateY(0) scale(1.04,.96)}50%,72%{transform:scale(.97,1.05)}86%{transform:scale(1.02,.98)}100%{transform:scale(1,1)}}
@keyframes ac-g2-eyes{0%,14%{transform:scale(1)}24%,72%{transform:scale(1.32)}88%,100%{transform:scale(1)}}
@keyframes ac-g2-brow{0%,14%{opacity:var(--b0);transform:translateY(0)}24%,72%{opacity:1;transform:translateY(-2px)}88%,100%{opacity:var(--b0);transform:translateY(0)}}
@keyframes ac-laugh{0%,100%{transform:translateY(0) scale(1.03,.96)}50%{transform:translateY(-1.8px) scale(.98,1.04)}}
@keyframes ac-wobble{0%,100%{transform:rotate(calc(var(--tilt) * -.5))}50%{transform:rotate(calc(var(--tilt) * .5))}}
@keyframes ac-jaw{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(.7px) scaleY(1.12)}}
@keyframes ac-g4-bob{0%,100%{transform:scale(1,1)}25%{transform:scale(1.03,.97)}50%{transform:translateY(-1.5px) scale(.98,1.03)}75%{transform:scale(1.03,.97)}}
@keyframes ac-lovesway{0%,100%{transform:rotate(0)}20%{transform:rotate(calc(var(--tilt) * -.8))}45%{transform:rotate(calc(var(--tilt) * .8))}70%{transform:rotate(calc(var(--tilt) * -.6))}85%{transform:rotate(0)}}
@keyframes ac-beat{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
@keyframes ac-heartup{0%{opacity:0;transform:translateY(4px) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translateY(-10px) scale(1.15)}}
@keyframes ac-g5-head{0%,8%{transform:rotate(0)}22%,40%{transform:rotate(calc(var(--tilt) * -.9))}52%,66%{transform:rotate(calc(var(--tilt) * .9))}80%{transform:rotate(0)}100%{transform:rotate(0)}}
@keyframes ac-g5-look{0%,8%{transform:translate(0,0)}20%,38%{transform:translate(-3.2px,-.4px)}50%,64%{transform:translate(3.2px,-.4px)}74%,86%{transform:translate(0,-3px)}96%,100%{transform:translate(0,0)}}
@keyframes ac-g5-face{0%,8%{transform:translate(0,0)}20%,38%{transform:translate(-1.4px,0)}50%,64%{transform:translate(1.4px,0)}74%,86%{transform:translate(0,-1px)}96%,100%{transform:translate(0,0)}}
@keyframes ac-g5-brow{0%,10%{opacity:var(--b0);transform:translateY(0)}24%,78%{opacity:1;transform:translateY(-2.2px) rotate(-8deg)}92%,100%{opacity:var(--b0);transform:translateY(0)}}
@keyframes ac-g5-mouth{0%,10%{transform:scaleX(1) translateX(0)}22%,38%{transform:scaleX(.6) translateX(-1.4px)}50%,64%{transform:scaleX(.6) translateX(1.4px)}80%,100%{transform:scaleX(1) translateX(0)}}
@keyframes ac-g5-bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.01,.99)}}
@keyframes ac-g6-bob{0%,8%{transform:scale(1,1)}16%{transform:translateY(0) scale(1.07,.9)}28%{transform:translateY(-3.2px) scale(.95,1.09)}40%{transform:translateY(0) scale(1.05,.94)}52%{transform:translateY(-1.8px) scale(.98,1.04)}64%{transform:translateY(0) scale(1.02,.98)}100%{transform:scale(1,1)}}
